# Match sibling: Urdu-English Code-Switching Analyzer (light research UI)
[theme]
base = "light"
primaryColor = "#1e4fd6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fb"
textColor = "#071526"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#ffffff"
primaryColor = "#1e4fd6"
textColor = "#071526"

[server]
headless = true
enableCORS = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

# Reduce top-right app chrome for viewers (same as sibling).
# "minimal" keeps only Cloud-injected / set_page_config menu items;
# if none remain, the ⋮ menu hides. Does not remove Streamlit Community
# Cloud host controls outside the app iframe (CSS + mask cover those).
[client]
toolbarMode = "minimal"
